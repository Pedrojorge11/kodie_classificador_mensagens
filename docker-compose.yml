services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kodie-helpdesk-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/classificacao_mensagens.db
    volumes:
      - helpdesk_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: kodie-helpdesk-web
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  helpdesk_data: